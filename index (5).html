<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>LOLY Dental Clinic Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400..900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>

:root{
  --green:#0B7A4B;--green-deep:#075C38;--leaf:#2FCB85;--mint:#E8F4EE;--mint-2:#D3EADD;
  --white:#fff;--black:#000;--ink-2:#4F5653;--ink-3:#6B736F;--line:#D8E3DD;--surface:#F6FAF8;
  --red:#C62828;--red-bg:#FBE9E7;--amber:#8F5200;--amber-bg:#FFF2DC;--blue:#14509A;--blue-bg:#E6EFFA;
  --display:Alexandria,"IBM Plex Sans Arabic",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r-s:10px;--r-m:16px;--r-l:24px;--r-xl:40px;
  --shadow:0 18px 50px -24px rgba(7,92,56,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--white);color:var(--black);font:400 16px/1.65 var(--body);overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display);line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] h4{letter-spacing:0;line-height:1.35}
p{margin:0}
a{color:var(--green-deep)}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--black);color:#fff;padding:10px 16px;border-radius:var(--r-s);z-index:100}
.skip:focus{top:12px}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:24px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--ink-2)}.small{font-size:14px}.tiny{font-size:13px}.strong{font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}.stack-l{display:flex;flex-direction:column;gap:24px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}
.grow{flex:1;min-width:0}.hide{display:none!important}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 20px;border-radius:999px;border:1.5px solid transparent;background:var(--green);color:#fff;font-weight:600;text-decoration:none;cursor:pointer;transition:background .15s,color .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--green-deep)}.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.dark{background:var(--black)}.btn.dark:hover{background:#2b2b2b}
.btn.line{background:#fff;color:var(--black);border-color:var(--black)}.btn.line:hover{background:var(--black);color:#fff}
.btn.soft{background:var(--mint);color:var(--green-deep)}.btn.soft:hover{background:var(--mint-2)}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}.btn.danger:hover{background:var(--red);color:#fff}
.btn.white{background:#fff;color:var(--black)}.btn.white:hover{background:var(--mint)}
.btn.small{min-height:36px;padding:5px 14px;font-size:14px}
.btn.big{min-height:54px;padding:12px 30px;font-size:17px}
.btn svg{width:18px;height:18px;flex:none}
.link{background:none;border:0;padding:0;color:var(--green-deep);text-decoration:underline;cursor:pointer;font-weight:500}
.iconbtn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:50%;border:0;background:transparent;color:inherit;cursor:pointer;position:relative}
.iconbtn:hover{background:var(--mint)}.iconbtn svg{width:22px;height:22px}
.count-dot{position:absolute;top:4px;inset-inline-end:2px;min-width:19px;height:19px;padding-inline:5px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700;line-height:19px;text-align:center}

/* Forms */
label.field{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:15px;min-width:0}
.hint{font-weight:400;font-size:13px;color:var(--ink-2)}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=date],input[type=time],input[type=number],input[type=search],input[type=url],select,textarea{width:100%;min-height:46px;padding:9px 13px;background:#fff;border:1.5px solid #9DADA5;border-radius:var(--r-s);font-weight:400}
textarea{min-height:92px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 3px var(--mint-2)}
input[type=date],input[type=time]{direction:ltr}
[dir=rtl] input[type=date],[dir=rtl] input[type=time]{text-align:end}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);flex:none;margin:2px 0 0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;cursor:pointer}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.form-error{background:var(--red-bg);color:#8E1B1B;border-radius:var(--r-s);padding:10px 14px;font-weight:500;font-size:15px}
.form-ok{background:var(--mint);color:var(--green-deep);border-radius:var(--r-s);padding:10px 14px;font-weight:500}
.searchbox{position:relative;flex:1;min-width:200px}
.searchbox svg{position:absolute;inset-inline-start:13px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--ink-2);pointer-events:none}
.searchbox input{padding-inline-start:40px}

/* Status badges: always an icon-like dot plus a word */
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.badge.pending{background:var(--amber-bg);color:var(--amber)}
.badge.confirmed,.badge.approved,.badge.published,.badge.sent,.badge.verified{background:var(--mint);color:var(--green-deep)}
.badge.completed{background:#000;color:#fff}
.badge.cancelled,.badge.failed,.badge.void,.badge.hidden{background:var(--red-bg);color:#9C1F1F}
.badge.draft,.badge.queued,.badge.skipped,.badge.unverified{background:#EEF1EF;color:#3D4441}
.badge.private{background:#000;color:#fff}.badge.shared{background:var(--blue-bg);color:var(--blue)}

/* Toast and dialog */
#toasts{position:fixed;inset-block-end:20px;inset-inline:0;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{background:#000;color:#fff;padding:12px 20px;border-radius:14px;font-weight:500;max-width:min(560px,100%);box-shadow:0 12px 36px rgba(0,0,0,.3);animation:rise .22s ease-out;pointer-events:auto}
.toast.err{background:var(--red)}.toast.ok{background:var(--green-deep)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
dialog{border:0;border-radius:var(--r-l);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 32px);color:var(--black);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog.wide{width:min(920px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.985)}}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.dlg-head h2{font-size:20px}
.dlg-body{padding:20px 22px}
.dlg-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}

/* Shared content */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:20px}
.panel h2,.panel h3{font-size:18px;margin-bottom:12px}
.empty{text-align:center;padding:38px 20px;color:var(--ink-2)}
.empty svg{width:56px;height:56px;margin:0 auto 12px;color:var(--mint-2)}
.empty h3{color:var(--black);font-size:18px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.skel{height:64px;border-radius:var(--r-s);background:linear-gradient(90deg,#EEF4F0 25%,#F8FBF9 50%,#EEF4F0 75%);background-size:300% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-150% 0}}
.notice{display:flex;gap:10px;padding:12px 15px;border-radius:var(--r-s);background:var(--amber-bg);color:#5F3700;font-size:15px}
.notice.info{background:var(--mint);color:var(--green-deep)}
.notice.bad{background:var(--red-bg);color:#8E1B1B}
.notice svg{width:20px;height:20px;flex:none;margin-top:2px}
.table-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:#fff}
table.tbl{border-collapse:collapse;width:100%;min-width:640px;font-size:15px}
.tbl th{font-weight:600;font-size:14px;color:var(--ink-2);text-align:start;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:11px 14px;border-bottom:1px solid #EAF0EC;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface)}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 18px}
.kv dt{color:var(--ink-2);font-size:14px}.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1.5px solid var(--line);margin-bottom:20px;scrollbar-width:none}
.tab{padding:10px 15px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;text-decoration:none;font-size:15px}
.tab:hover{color:var(--black)}.tab.on{color:var(--green-deep);border-color:var(--green)}
.seg{display:inline-flex;background:var(--mint);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 15px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--green-deep);min-height:36px}
.seg button.on{background:var(--green);color:#fff}
.stars{display:inline-flex;gap:1px;color:var(--green);direction:ltr}
.stars svg{width:17px;height:17px}.stars .off{color:#C9D6CE}

/* Public site */
.site-head{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid transparent;transition:border-color .2s}
.site-head.stuck{border-color:var(--line)}
.site-head .wrap{display:flex;align-items:center;gap:20px;min-height:74px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--black);font:800 23px/1 var(--display);letter-spacing:.02em}
.logo .mark{width:42px;height:42px;border-radius:13px;background:var(--green);display:grid;place-items:center;overflow:hidden;flex:none}
.logo .mark svg{width:26px;height:26px;color:#fff}.logo .mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo small{display:block;font:500 11.5px/1.2 var(--body);color:var(--ink-2);letter-spacing:0;margin-top:3px}
.nav-links{display:flex;gap:22px;margin-inline-start:12px}
.nav-links a{text-decoration:none;color:var(--black);font-weight:500}.nav-links a:hover{color:var(--green)}
.lang-btn{background:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:600;cursor:pointer;min-height:38px;font-size:14px}
.lang-btn:hover{border-color:var(--black)}

.hero{padding-block:30px 72px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:48px;align-items:center}
.hero h1{font-size:clamp(38px,5.6vw,72px);font-weight:800;line-height:1.08;letter-spacing:-.025em}
[dir=rtl] .hero h1{letter-spacing:0;line-height:1.28;font-size:clamp(35px,5vw,64px)}
.hero p.lead{font-size:clamp(17px,1.5vw,20px);color:var(--ink-2);margin-block:22px 30px;max-width:33em}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.arch-panel{position:relative;background:var(--green);border-radius:var(--r-xl);aspect-ratio:1/1.02;overflow:hidden;color:#fff}
.arch-panel svg.arch{position:absolute;inset:0;width:100%;height:100%}
.arch-panel .t{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;animation:toothIn .5s cubic-bezier(.2,.9,.3,1.25) forwards}
@keyframes toothIn{from{opacity:0;scale:.5}to{opacity:1;scale:1}}
.ticket{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);width:min(58%,330px);background:#fff;color:#000;border-radius:var(--r-l);padding:20px 22px;box-shadow:0 26px 50px -18px rgba(0,0,0,.5);text-align:center}
.ticket .lbl{font-size:14px;color:var(--ink-2);font-weight:500}
.ticket .d{font:700 clamp(17px,1.9vw,23px)/1.3 var(--display);margin-top:4px}
.ticket .tm{font:800 clamp(28px,3.4vw,42px)/1.2 var(--display);color:var(--green);margin-block:2px 12px}
.ticket .btn{width:100%}

.band{padding-block:72px}
.band.tint{background:var(--surface)}
.band.black{background:#000;color:#fff}
.sec-title{font-size:clamp(28px,3.4vw,44px);font-weight:800;margin-bottom:12px}
.sec-sub{color:var(--ink-2);max-width:42em;font-size:17px}
.band.black .sec-sub{color:#CBD3CF}
.intro-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:center}
.intro-photo{border-radius:var(--r-xl);overflow:hidden;background:var(--mint);aspect-ratio:4/3;display:grid;place-items:center}
.intro-photo img{width:100%;height:100%;object-fit:cover}
.service-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:56px;margin-top:34px}
.service{display:grid;grid-template-columns:58px 1fr;gap:16px;padding-block:20px;border-top:1px solid var(--line)}
.service .ico{width:58px;height:58px;border-radius:18px;background:var(--mint);color:var(--green);display:grid;place-items:center}
.service .ico svg{width:34px;height:34px}
.service h3{font-size:19px;margin-bottom:3px}
.service p{color:var(--ink-2);font-size:15px}
.why-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px;margin-top:38px}
.why svg{width:40px;height:40px;color:var(--leaf);margin-bottom:14px}
.why h3{font-size:19px;margin-bottom:6px}
.why p{color:#CBD3CF;font-size:15px}
.rev-layout{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:48px;margin-top:34px}
.rev-score{font:800 76px/1 var(--display);color:var(--green)}
.dist{display:grid;grid-template-columns:18px 1fr 26px;gap:6px 9px;align-items:center;font-size:14px;margin-top:16px}
.dist .bar{height:8px;border-radius:4px;background:var(--mint);overflow:hidden}
.dist .bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.rev-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.rev{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:18px}
.rev blockquote{margin:9px 0;overflow-wrap:anywhere}
.contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px;margin-top:30px}
.hours{width:100%;border-collapse:collapse}.hours td{padding:7px 0;border-bottom:1px solid var(--line)}.hours td:last-child{text-align:end}
.hours tr.today td{font-weight:700;color:var(--green-deep)}
.contact-line{display:flex;gap:12px;align-items:flex-start;padding-block:9px}
.contact-line svg{width:22px;height:22px;color:var(--green);flex:none;margin-top:2px}
.foot{background:var(--green-deep);color:#fff;padding-block:40px 24px}
.foot a{color:#fff}
.foot-grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-start}
.foot .logo{color:#fff}.foot .logo .mark{background:#fff}.foot .logo .mark svg{color:var(--green)}.foot .logo small{color:#D2EADD}
.socials{display:flex;gap:8px}
.socials a{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.socials a:hover{background:rgba(255,255,255,.28)}.socials svg{width:20px;height:20px}
.foot-bottom{border-top:1px solid rgba(255,255,255,.2);margin-top:24px;padding-top:16px;font-size:14px;color:#D2EADD}

/* Sign-in */
.auth-page{min-height:calc(100dvh - 74px);display:grid;place-items:start center;background:var(--surface);padding:34px 16px 60px}
.auth-card{width:min(540px,100%);background:#fff;border-radius:var(--r-l);padding:clamp(22px,4vw,36px);box-shadow:var(--shadow)}
.auth-card h1{font-size:27px;margin-bottom:6px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.choice{display:flex;flex-direction:column;gap:9px;padding:20px 16px;border:2px solid var(--line);border-radius:var(--r-m);background:#fff;text-align:start;cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--green);background:var(--mint)}
.choice svg{width:38px;height:38px;color:var(--green)}
.choice b{font:700 18px/1.3 var(--display)}
.choice span{font-size:14px;color:var(--ink-2)}

/* Portals */
.p-head{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.p-head .wrap{display:flex;align-items:center;gap:12px;min-height:68px}
.p-nav{display:flex;gap:2px;margin-inline-start:14px}
.p-nav a{padding:8px 13px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:15px;white-space:nowrap}
.p-nav a:hover{color:#000;background:var(--surface)}.p-nav a.on{background:var(--mint);color:var(--green-deep)}
.p-main{padding-block:26px 90px;min-height:70vh}
.p-title{font-size:clamp(24px,3vw,32px);font-weight:800}
.p-sub{color:var(--ink-2);margin-top:3px}
.p-tabs{display:none}
.book-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(290px,1fr);gap:22px;align-items:start;margin-top:20px}

/* Calendar */
.cal{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h3{font-size:20px}
.cal-head .iconbtn svg{transition:none}
[dir=rtl] .cal-head .iconbtn svg{transform:scaleX(-1)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-dow{text-align:center;font-size:13px;color:var(--ink-2);font-weight:600;padding-block:4px}
.day{position:relative;aspect-ratio:1/.92;min-height:44px;border-radius:12px;border:1.5px solid transparent;background:#F0F2F1;color:#8A928E;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:16px;padding:2px}
button.day{cursor:pointer}
.day small{font-size:11px;font-weight:500;line-height:1.1}
.day.available{background:var(--mint);color:var(--green-deep);border-color:#A7D6BC}
button.day.available:hover{background:var(--mint-2)}
.day.full{background:var(--red);color:#fff;border-color:var(--red)}
.day.past{background:transparent;color:#AEB6B2}
.day.closed{background:#EEF0EF;color:#737B77;background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(0,0,0,.05) 5px 7px)}
.day.sel{background:var(--green)!important;color:#fff!important;border-color:#000}
.day.today::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:currentColor}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:5px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{min-height:44px;border-radius:var(--r-s);border:1.5px solid var(--green);background:#fff;color:var(--green-deep);font-weight:600;cursor:pointer;padding:4px}
.slot:hover{background:var(--mint)}.slot.sel{background:var(--green);color:#fff}
.slot[disabled]{border-color:#E1E6E3;background:#F3F5F4;color:#9AA29E;text-decoration:line-through;cursor:not-allowed}
.summary{background:var(--mint);border-radius:var(--r-m);padding:15px 17px}

.appt-card{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:16px;border:1px solid var(--line);border-radius:var(--r-m);background:#fff}
.dateblock{background:var(--mint);border-radius:14px;text-align:center;padding:8px 4px;color:var(--green-deep);align-self:start}
.dateblock b{display:block;font:800 26px/1.15 var(--display)}
.dateblock span{font-size:13px;font-weight:600}

  await new Promise((r) => { setTimeout(r, 40); });
  try {
    if (opts.raw) fail2(409, 'demo_only');

    save();
    return JSON.parse(JSON.stringify(res));

    save();
    if (e instanceof ApiErr && e.status === 401 && e.code === 'not_signed_in' && S.user) { S.user = null; stopLive(); go('/signin'); }

/* Feedback */
function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), kind === 'err' ? 7000 : 4200);
}
const ok = (m) => toast(m, 'ok');

function closeDialog(d) { if (d?.open) d.close(); }
/** Opens a dialog. content is html; returns the element. */
function dialog({ title, body, foot, wide, onClose }) {
  const d = document.createElement('dialog');
  if (wide) d.className = 'wide';
  mount(d, html`<div class="dlg-head"><h2>${title}</h2><button class="iconbtn" type="button" data-close aria-label="${L('Close', 'إغلاق')}">${I.x()}</button></div>
    <div class="dlg-body">${body}</div>${foot ? html`<div class="dlg-foot">${foot}</div>` : ''}`);
  document.body.append(d);
  d.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) d.close(); });
  d.addEventListener('close', () => { d.remove(); onClose?.(); });
  d.showModal();
  return d;
}
function confirmBox({ title, text, yes, danger, input }) {
  return new Promise((resolve) => {
    let answer = false;
    const d = dialog({
      title,
      body: html`<div>${text}</div>${input ? html`<label class="field" style="margin-top:14px">${input.label}<textarea id="confirmInput" maxlength="500" ${input.required ? new Safe('required') : ''}></textarea></label>` : ''}`,
      foot: html`<button class="btn line" type="button" data-close>${L('Go back', 'رجوع')}</button><button class="btn ${danger ? 'danger' : ''}" type="button" id="confirmYes">${yes}</button>`,
      onClose: () => resolve(answer),
    });
    $('#confirmYes', d).addEventListener('click', () => {
      const field = $('#confirmInput', d);
      if (input?.required && !field.value.trim()) { field.focus(); return; }
      answer = input ? field.value.trim() || ' ' : true;
      d.close();
    });
  });
}

  const fn = A[el.dataset.act];

document.addEventListener('submit', async (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const fn = F[form.dataset.form];
  if (!fn) return;
  const btns = $$('button[type=submit]', form);
  const errEl = $('.form-error', form);
  if (errEl) errEl.classList.add('hide');
  btns.forEach((b) => { b.disabled = true; });
  const data = {};
  new FormData(form).forEach((v, k) => { data[k] = typeof v === 'string' ? v.trim() : v; });
  $$('input[type=checkbox]', form).forEach((c) => { if (c.name) data[c.name] = c.checked; });
  try { await fn(data, form); } catch (err) {
    if (errEl) { errEl.textContent = errText(err); errEl.classList.remove('hide'); errEl.scrollIntoView({ block: 'nearest' }); } else bad(err);

const ROUTES = [];
const on = (re, fn, role) => ROUTES.push({ re, fn, role });

async function route({ keepScroll } = {}) {
  const token = ++routeToken;
  S.live = null;
  $$('dialog[open]').forEach((d) => { if (!d.dataset.keep) d.close(); });
  const raw = demoPath;
  const [path, qs] = raw.split('?');
  const query = Object.fromEntries(new URLSearchParams(qs || ''));
  for (const r of ROUTES) {
    const m = path.match(r.re);
    if (!m) continue;
    if (r.role && !S.user) { S.next = raw; go(`/signin/${r.role}`); return; }
    // The server refuses these pages' data anyway; this only shows a clear message.
    if (r.role && S.user.role !== r.role) { renderForbidden(); return; }
    const y = window.scrollY;
    try { await r.fn({ params: m.slice(1), query, isCurrent: () => token === routeToken }); } catch (e) { simpleShell(html`<div class="auth-page"><div class="auth-card">${errorBox(e)}</div></div>`); }
    if (token === routeToken) window.scrollTo(0, keepScroll ? y : 0);
    return;
  }
  renderNotFound();
}
document.addEventListener('click', (e) => {

  const href = a.getAttribute('href');
  const rx = href.match(/prescriptions\/([\w-]+)\/(pdf|preview)/);
  if (rx) { e.preventDefault(); demoRxView(rx[1]); return; }
  if (href.startsWith('#/') && !a.dataset.act) { e.preventDefault(); go(href.slice(1)); }
  else if (href.startsWith('tel:') || href.startsWith('mailto:')) e.preventDefault();
});

/* Month calendar used by the patient, by the doctor and by the time pickers */
const WEEK_START = 6; // Saturday
function dowHeaders() {
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(Date.UTC(2024, 0, 6 + i, 12)); // 6 Jan 2024 is a Saturday
    return html`<div class="cal-dow">${new Intl.DateTimeFormat(locale(), { weekday: 'short', timeZone: 'UTC' }).format(d)}</div>`;
  });
}
const leadBlanks = (firstDate) => { const wd = asDate(firstDate).getUTCDay(); return (wd - WEEK_START + 7) % 7; };
const CLOSE_WHY = { day_off: ['Clinic closed', 'العيادة مغلقة'], holiday: ['Holiday', 'إجازة'], blocked: ['Not available', 'غير متاح'], closure: ['Clinic closed', 'العيادة مغلقة'], temporary: ['Temporarily closed', 'مغلقة مؤقتًا'], too_far: ['Not open for booking yet', 'لم يُفتح الحجز بعد'], day_finished: ['Day finished', 'انتهى اليوم'] };
function dayLabel(d) {
  const base = fDate(d.date);
  if (d.status === 'full') return `${base}: ${L('fully booked', 'محجوز بالكامل')}`;
  if (d.status === 'available') return `${base}: ${L(`${d.free} times available`, `${num(d.free)} موعد متاح`)}`;
  if (d.status === 'past') return `${base}: ${L('past date', 'تاريخ مضى')}`;
  const why = CLOSE_WHY[d.reason];
  return `${base}: ${why ? L(why[0], why[1]) : L('closed', 'مغلق')}`;
}
/**
 * Draws a month. Available days are green buttons. Full days are red and disabled.
 * Past and closed days are disabled.
 */
function calendarHtml(data, { selected, doctorMode, showCounts = true } = {}) {
  const title = new Intl.DateTimeFormat(locale(), { month: 'long', year: 'numeric', timeZone: 'UTC' }).format(asDate(`${data.month}-15`));
  return html`<div class="cal-head"><button class="iconbtn" type="button" data-cal="prev" aria-label="${L('Previous month', 'الشهر السابق')}" ${data.month <= monthOf(data.today) && !doctorMode ? new Safe('disabled') : ''}>${I.left()}</button>
    <h3 aria-live="polite">${title}</h3>
    <button class="iconbtn" type="button" data-cal="next" aria-label="${L('Next month', 'الشهر التالي')}">${I.right()}</button></div>
  <div class="cal-grid">${dowHeaders()}
    ${Array.from({ length: leadBlanks(data.days[0].date) }, () => new Safe('<div></div>'))}
    ${data.days.map((d) => {
      const n = Number(d.date.slice(8));
      const clickable = d.status === 'available' || (doctorMode && d.status !== 'past');
      const cls = `day ${d.status}${d.date === selected ? ' sel' : ''}${d.date === data.today ? ' today' : ''}`;
      const sub = d.status === 'full' ? L('Full', 'مكتمل') : (d.status === 'available' && showCounts ? L(`${d.free} free`, `${num(d.free)} متاح`) : '');
      return clickable
        ? html`<button class="${cls}" type="button" data-day="${d.date}" aria-label="${dayLabel(d)}" aria-pressed="${String(d.date === selected)}">${num(n)}${sub ? html`<small>${sub}</small>` : ''}</button>`
        : html`<div class="${cls}" role="img" aria-label="${dayLabel(d)}" title="${dayLabel(d)}" aria-disabled="true">${num(n)}${sub ? html`<small>${sub}</small>` : ''}</div>`;
    })}
  </div>
  <div class="legend">
    <span><i style="background:var(--mint);border:1.5px solid #A7D6BC"></i>${L('Available', 'متاح')}</span>
    <span><i style="background:var(--red)"></i>${L('Fully booked', 'محجوز بالكامل')}</span>
    <span><i style="background:#E3E6E5"></i>${L('Closed or past', 'مغلق أو مضى')}</span>
  </div>`;
}

/**
 * Self-contained date and time picker. It refreshes whenever the schedule changes.
 * onPick(slot) receives the slot the person selected.
 */
function timePicker(root, { onPick, slotsTarget, initialMonth }) {
  const st = { month: initialMonth || monthOf(todayStr()), date: null, slot: null, data: null };
  const calEl = root;
  async function loadMonth() {
    calEl.setAttribute('aria-busy', 'true');
    try {
      st.data = await get(`/availability/month?month=${st.month}`);
      mount(calEl, calendarHtml(st.data, { selected: st.date, doctorMode: S.user?.role === 'doctor' }));
    } catch (e) { mount(calEl, errorBox(e, false)); }
    calEl.removeAttribute('aria-busy');
  }
  async function loadDay() {
    if (!st.date) {
      mount(slotsTarget, html`<div class="empty" style="padding:24px 8px"><p>${L('Choose a green day to see the available times.', 'اختر يومًا باللون الأخضر لعرض المواعيد المتاحة.')}</p></div>`);
      return;
    }
    const day = await get(`/availability/day?date=${st.date}`);
    const free = day.slots.filter((s) => !s.past);
    if (st.slot && !free.some((s) => s.start_at === st.slot.start_at && s.free)) { st.slot = null; onPick(null); }
    mount(slotsTarget, html`<h3 style="margin-bottom:10px">${fDate(st.date)}</h3>
      ${free.length ? html`<div class="slots" role="group" aria-label="${L('Available times', 'المواعيد المتاحة')}">${free.map((s) => html`<button type="button" class="slot${st.slot?.start_at === s.start_at ? ' sel' : ''}" data-slot="${s.start_at}" ${s.free ? '' : new Safe('disabled')} aria-pressed="${String(st.slot?.start_at === s.start_at)}">${fTime(s.time)}<span class="sr">${s.free ? '' : L(' taken', ' محجوز')}</span></button>`)}</div>`
        : html`<p class="muted">${L('No times are open on this day.', 'لا توجد مواعيد متاحة في هذا اليوم.')}</p>`}`);
    st.free = free;
  }
  calEl.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-cal]');
    if (nav && !nav.disabled) { st.month = addMonth(st.month, nav.dataset.cal === 'next' ? 1 : -1); loadMonth(); return; }
    const dayBtn = e.target.closest('[data-day]');
    if (dayBtn) { st.date = dayBtn.dataset.day; st.slot = null; onPick(null); loadMonth(); loadDay().catch(bad); }
  });
  slotsTarget.addEventListener('click', (e) => {
    const b = e.target.closest('[data-slot]');
    if (!b || b.disabled) return;
    st.slot = st.free.find((s) => s.start_at === b.dataset.slot);
    onPick(st.slot);
    $$('.slot', slotsTarget).forEach((x) => { const on2 = x === b; x.classList.toggle('sel', on2); x.setAttribute('aria-pressed', String(on2)); });
  });
  const reload = () => Promise.all([loadMonth(), loadDay()]).catch(() => {});
  reload();
  return { reload, clear: () => { st.slot = null; st.date = null; reload(); } };
}

/** The upper dental arch: 14 teeth along a curve, largest at the back. It holds the clinic's next open time. */
function archSvg() {
  const W = 500, H = 510, cx = W / 2, rx = 205, ry = 300, cy = 372;
  const n = 14;
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const teeth = [];
  for (let i = 0; i < n; i += 1) {
    const u = i / (n - 1);
    const ang = Math.PI * (1.0 + u); // from the left molars over the top to the right molars
    const x = cx + rx * Math.cos(ang), y = cy + ry * Math.sin(ang) * 0.98;
    const edge = Math.abs(u - 0.5) * 2;
    const scale = 0.33 + edge * 0.17;
    const nx = Math.cos(ang) * ry, ny = Math.sin(ang) * rx;
    const deg = Math.atan2(ny, nx) * 180 / Math.PI + 90;
    const delay = reduce ? 0 : Math.abs(u - 0.5) * 2 * 520 + 120;
    teeth.push(`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${deg.toFixed(1)}) scale(${scale.toFixed(3)}) translate(-50 -52)"><path class="t" style="animation-delay:${delay.toFixed(0)}ms" d="${TOOTH}"/></g>`);
  }
  return new Safe(`<svg class="arch" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${teeth.join('')}</svg>`);
}

const emailOk = (v) => /^\S+@\S+\.\S+$/.test(v);

F.auth = async (d, form) => {
  const { role, mode } = form.dataset;
  const say = (en, ar) => { throw Object.assign(new ApiErr('x'), { code: 'local' }, { en, ar }); };
  try {
    if (mode === 'new' && d.full_name.length < 2) say('Enter your full name.', 'أدخل اسمك الكامل.');
    if (!emailOk(d.email)) say('Enter a valid email address.', 'أدخل بريدًا إلكترونيًا صحيحًا.');
    if (mode === 'new' && !phoneOk(d.phone)) say('Enter a valid phone number.', 'أدخل رقم هاتف صحيحًا.');
    if (mode === 'new' && (d.password.length < (role === 'doctor' ? 10 : 8) || !/\d/.test(d.password) || !/\D/.test(d.password))) say(`Your password needs at least ${role === 'doctor' ? 10 : 8} characters, with a letter and a number.`, `يجب ألا تقل كلمة المرور عن ${role === 'doctor' ? 10 : 8} أحرف، وأن تشمل حرفًا ورقمًا.`);
    if (!d.password) say('Enter your password.', 'أدخل كلمة المرور.');
    if (role === 'doctor' && !d.verification_code) say('Enter your approval verification code.', 'أدخل رمز التحقق والموافقة.');
  } catch (err) {
    const el = $('.form-error', form);
    el.textContent = L(err.en, err.ar);
    el.classList.remove('hide');
    return;
  }
  d.locale = S.lang;
  const res = mode === 'new'
    ? await post(`/auth/register/${role}`, d)
    : await post('/auth/login', { role, email: d.email, password: d.password, verification_code: d.verification_code });
  afterAuth(res.user);
};

          <label class="field">${L('Note for the clinic (optional)', 'ملاحظة للعيادة (اختياري)')}<textarea name="note" maxlength="500" rows="2"></textarea></label>
          <button class="btn big" type="submit">${L('Review booking', 'مراجعة الحجز')}</button>
        </form>
      </div>

F.book = async (d, form) => {
  const slot = BOOK.slot;
  if (!slot) return;
  const svcRow = S.clinic.services.find((s) => s.id === d.service_id);
  const confirmed = await confirmBox({
    title: L('Confirm your booking', 'تأكيد الحجز'),
    text: html`<div class="summary"><div class="strong">${fDate(slot.date)}</div><div style="font:800 26px/1.4 var(--display);color:var(--green-deep)">${fTime(slot.time)}</div>
      ${svcRow ? html`<div>${L(svcRow.name_en, svcRow.name_ar)}</div>` : ''}</div>
      <p class="muted small" style="margin-top:10px">${L('Your request stays Pending until the clinic confirms it.', 'يبقى طلبك قيد الانتظار حتى تؤكده العيادة.')}</p>`,
    yes: L('Confirm booking', 'تأكيد الحجز'),
  });
  if (!confirmed) return;
  try {
    await post('/me/appointments', { start_at: slot.start_at, service_id: d.service_id || null, note: d.note || '' });
  } catch (e) {
    await BOOK.tp.reload();
    throw e;
  }
  form.reset();
  BOOK.slot = null;
  form.classList.add('hide');
  ok(L('Your booking was sent. The clinic will confirm it soon.', 'تم إرسال حجزك. ستؤكده العيادة قريبًا.'));
  go('/patient/appointments');
};

/* ---------- My appointments ---------- */
function apptCard(a) {
  const past = a.is_past || ['completed', 'cancelled'].includes(a.status);
  const canAct = ['pending', 'confirmed'].includes(a.status) && !a.is_past;
  return html`<article class="appt-card ${past ? 'done' : ''}">
    <div class="dateblock"><b>${num(Number(a.date.slice(8)))}</b><span>${fmt(a.date, { month: 'short' })}</span></div>
    <div class="stack" style="gap:6px;min-width:0">
      <div class="row between"><strong>${fmt(a.date, { weekday: 'long' })}, ${fTime(a.time)}</strong>${badge(a.status)}</div>
      ${svcName(a) ? html`<div class="muted small">${svcName(a)}</div>` : ''}
      ${a.requested ? html`<div class="notice info small" style="padding:7px 11px">${I.clock()}<div>${L('You asked to move to', 'طلبت النقل إلى')} ${fDateS(a.requested.date)}, ${fTime(a.requested.time)}. ${L('Waiting for the clinic.', 'بانتظار رد العيادة.')}</div></div>` : ''}
      ${a.status === 'cancelled' && a.cancel_reason ? html`<div class="muted small">${L('Reason:', 'السبب:')} ${a.cancel_reason}</div>` : ''}
      <div class="row" style="gap:8px;margin-top:4px">
        ${canAct ? html`<button class="btn small soft" data-act="pChange" data-id="${a.id}">${L('Request another time', 'طلب موعد آخر')}</button>
          <button class="btn small danger" data-act="pCancel" data-id="${a.id}" data-when="${fDate(a.date)}, ${fTime(a.time)}">${L('Cancel appointment', 'إلغاء الموعد')}</button>` : ''}
        ${a.status === 'completed' && !a.reviewed ? html`<a class="btn small" href="#/patient/reviews?appt=${a.id}">${L('Rate your visit', 'قيّم زيارتك')}</a>` : ''}
        ${a.status === 'completed' && a.reviewed ? html`<span class="small muted">${L('You reviewed this visit. Thank you.', 'لقد قيّمت هذه الزيارة. شكرًا لك.')}</span>` : ''}
      </div>
    </div></article>`;
}
async function drawAppointments(body) {
  const { appointments: all } = await get('/me/appointments');
  const upcoming = all.filter((a) => ['pending', 'confirmed'].includes(a.status) && !a.is_past).reverse();
  const prev = all.filter((a) => !upcoming.includes(a));
  const policy = L(S.clinic.clinic.cancel_policy_en, S.clinic.clinic.cancel_policy_ar);
  const h = S.clinic.clinic.cancel_notice_hours;
  mount(body, html`
    <div class="row between"><div><h1 class="p-title">${L('My appointments', 'مواعيدي')}</h1></div><a class="btn" href="#/patient/book">${L('Book an appointment', 'احجز موعدًا')}</a></div>
    <div class="notice info" style="margin-top:14px">${I.info()}<div>${policy || L(`You can cancel a confirmed appointment online up to ${h} hours before it starts. Closer than that, call the clinic.`, `يمكنك إلغاء الموعد المؤكد عبر الموقع قبل ${num(h)} ساعة من بدايته. بعد ذلك يُرجى الاتصال بالعيادة.`)}</div></div>
    <h2 style="font-size:20px;margin-block:22px 10px">${L('Upcoming', 'القادمة')}</h2>
    ${upcoming.length ? html`<div class="stack">${upcoming.map(apptCard)}</div>` : emptyState(L('No upcoming appointments', 'لا توجد مواعيد قادمة'), L('Book a time that suits you.', 'احجز موعدًا يناسبك.'), html`<a class="btn" href="#/patient/book">${L('Book an appointment', 'احجز موعدًا')}</a>`)}
    <h2 style="font-size:20px;margin-block:26px 10px">${L('Previous', 'السابقة')}</h2>
    ${prev.length ? html`<div class="stack">${prev.map(apptCard)}</div>` : html`<p class="muted">${L('Your past visits will appear here.', 'ستظهر زياراتك السابقة هنا.')}</p>`}`);
}
on(/^\/patient\/appointments$/, async () => {
  if (!S.clinic) await loadClinic();
  const body = patientShell('appointments', skeleton());
  try { await drawAppointments(body); } catch (e) { mount(body, errorBox(e)); }
  S.live = () => drawAppointments($('#pBody')).catch(() => {});
}, 'patient');

function noteText(n) {
  const p = n.params || {};
  const w = p.date && p.time ? `${fDateS(p.date)}, ${fTime(p.time)}` : '';
  const T = {
    appointment_confirmed: [`Your appointment on ${w} is confirmed.`, `تم تأكيد موعدك بتاريخ ${w}.`],
    appointment_rescheduled: [`Your appointment moved to ${w}.`, `تم نقل موعدك إلى ${w}.`],
    appointment_completed: [`Your visit on ${w} is complete. You can now rate it.`, `اكتملت زيارتك بتاريخ ${w}. يمكنك تقييمها الآن.`],
    appointment_reminder: [`Reminder: you have an appointment on ${w}.`, `تذكير: لديك موعد بتاريخ ${w}.`],
    new_prescription: [`A new prescription (#${p.number}) is ready.`, `روشتة جديدة (#${p.number}) جاهزة.`],
    change_declined: [`The clinic could not move your appointment. It stays on ${w}.`, `تعذر على العيادة نقل موعدك. يبقى موعدك بتاريخ ${w}.`],
    new_appointment_request: [`${p.patient} asked for an appointment on ${w}.`, `طلب ${p.patient} موعدًا بتاريخ ${w}.`],
    new_patient: [`New patient registered: ${p.patient}.`, `تسجيل مريض جديد: ${p.patient}.`],
    new_review: [`${p.patient} left a ${p.rating}-star review.`, `أضاف ${p.patient} تقييمًا من ${p.rating} نجوم.`],
    change_request: [`${p.patient} asked to move an appointment from ${w}.`, `طلب ${p.patient} نقل موعده من ${w}.`],
    email_failed: [`An email could not be sent to ${p.recipient}.`, `تعذر إرسال رسالة إلى ${p.recipient}.`],
  };
  if (n.type === 'appointment_cancelled') {
    return p.patient ? L(`${p.patient} cancelled the appointment on ${w}.`, `ألغى ${p.patient} موعد ${w}.`) : L(`Your appointment on ${w} was cancelled.`, `تم إلغاء موعدك بتاريخ ${w}.`);
  }
  const m = T[n.type];
  return m ? L(m[0], m[1]) : n.type;
}

/* ---------- Appointments ---------- */
const AV = { view: 'list', date: null, q: '', status: '' };
const weekStart = (s) => { const wd = asDate(s).getUTCDay(); return addDays(s, -((wd - WEEK_START + 7) % 7)); };
function viewRange() {
  const d = AV.date;
  if (AV.view === 'day') return [d, d];
  if (AV.view === 'week') { const w = weekStart(d); return [w, addDays(w, 6)]; }
  if (AV.view === 'month') { const m = monthOf(d); return [`${m}-01`, addDays(`${addMonth(m, 1)}-01`, -1)]; }
  return [null, null];
}
function rangeTitle() {
  const [a, b] = viewRange();
  if (AV.view === 'day') return fDate(a);
  if (AV.view === 'week') return `${fDateS(a)} - ${fDateS(b)}`;
  return new Intl.DateTimeFormat(locale(), { month: 'long', year: 'numeric', timeZone: 'UTC' }).format(asDate(a));
}
const apptRow = (a) => html`<tr class="click" data-act="openAppt" data-id="${a.id}">
  <td><strong>${fDateS(a.date)}</strong><div class="tiny muted">${fTime(a.time)}</div></td>
  <td><strong>${a.patient_name}</strong><div class="tiny muted"><span class="ltr">${a.patient_phone || ''}</span></div></td>
  <td class="small">${svcName(a) || '-'}</td>
  <td>${badge(a.status)}${a.requested ? html`<div class="tiny" style="color:var(--amber);margin-top:3px">${L('Asked for another time', 'طلب موعدًا آخر')}</div>` : ''}</td>
  <td style="text-align:end"><button class="btn small soft" data-act="openAppt" data-id="${a.id}">${L('Open', 'فتح')}</button></td></tr>`;
const chip = (a) => html`<button class="chip ${a.status}" data-act="openAppt" data-id="${a.id}" title="${fTime(a.time)} ${a.patient_name}: ${L(STATUS[a.status][0], STATUS[a.status][1])}">${fTime(a.time)} ${a.patient_name}</button>`;

async function drawAppts() {
  const [from, to] = viewRange();
  const qs = new URLSearchParams();
  if (from) { qs.set('from', from); qs.set('to', to); }
  if (AV.q) qs.set('q', AV.q);
  if (AV.status === 'requests') qs.set('requests', '1');
  else if (AV.status) qs.set('status', AV.status);
  if (AV.view === 'list' && !AV.q && !AV.status) qs.set('from', todayStr());
  const { appointments: list } = await get(`/doctor/appointments?${qs}`);
  const box = $('#apptResults');
  if (!box) return;
  const today = todayStr();
  let content;
  if (AV.view === 'month' || AV.view === 'week') {
    const [a, b] = viewRange();
    const start = AV.view === 'month' ? weekStart(a) : a;
    const days = [];
    for (let d = start; d <= b || days.length % 7; d = addDays(d, 1)) days.push(d);
    content = html`<div class="${AV.view === 'week' ? 'week-scroll' : ''}"><div class="ag-grid">${dowHeaders()}${days.map((d) => html`<div class="ag-day ${monthOf(d) !== monthOf(AV.date) && AV.view === 'month' ? 'other' : ''} ${d === today ? 'now' : ''}"><span class="ag-num">${num(Number(d.slice(8)))}</span>${list.filter((x) => x.date === d).map(chip)}</div>`)}</div></div>`;
  } else if (list.length) {
    content = html`<div class="table-wrap"><table class="tbl"><thead><tr><th>${L('Date and time', 'التاريخ والوقت')}</th><th>${L('Patient', 'المريض')}</th><th>${L('Service', 'الخدمة')}</th><th>${L('Status', 'الحالة')}</th><th><span class="sr">${L('Actions', 'الإجراءات')}</span></th></tr></thead><tbody>${list.map(apptRow)}</tbody></table></div>`;
  } else {
    content = emptyState(L('No appointments found', 'لا توجد مواعيد'), L('Change the filters, or add an appointment yourself.', 'غيّر عوامل التصفية أو أضف موعدًا بنفسك.'));
  }
  mount(box, content);
}

      <label class="field">${L('Private notes (never shown to the patient)', 'ملاحظات خاصة (لا تظهر للمريض)')}<textarea id="apNotes" maxlength="4000">${a.private_notes || ''}</textarea></label>
      <div><button class="btn small line" id="apSaveNotes">${L('Save notes', 'حفظ الملاحظات')}</button></div>
    </div>`,

      ${a.status === 'confirmed' ? html`<button class="btn dark" id="apComplete">${L('Mark completed', 'تحديد كمكتمل')}</button>` : ''}

  });
  const wire = (sel, fn) => { const b = $(sel, d); if (b) b.addEventListener('click', () => Promise.resolve(fn()).catch(bad)); };

  wire('#apConfirm', () => act('confirm', {}, L('Appointment confirmed.', 'تم تأكيد الموعد.')));
  wire('#apChange', () => act('approve-change', {}, L('Appointment moved.', 'تم نقل الموعد.')));

    if (r) await act('reject', { reason: r.trim() }, L('Request rejected. The time is free again.', 'تم رفض الطلب، وأصبح الموعد متاحًا.'));

/* Add an appointment by hand, for an existing patient or a new one */
A.addAppt = async () => {
  const d = dialog({
    title: L('Add appointment', 'إضافة موعد'), wide: true,
    body: html`<div class="stack-l" style="gap:14px"><div>
      <div class="searchbox">${I.search()}<input type="search" id="adQ" placeholder="${L('Find a patient by name, phone or email', 'ابحث عن مريض بالاسم أو الهاتف أو البريد')}" aria-label="${L('Find patient', 'بحث عن مريض')}"></div>
      <div id="adList" class="rx-results hide"></div><div id="adChosen" class="form-ok hide" style="margin-top:8px"></div>
      <details style="margin-top:10px" id="adNewWrap"><summary style="cursor:pointer" class="strong">${L('New patient without an account', 'مريض جديد بدون حساب')}</summary>
        <form class="form-grid" style="margin-top:10px" data-form="adNew">${formError()}
          <label class="field">${L('Full name', 'الاسم الكامل')}<input name="full_name" type="text" required minlength="2"></label>
          <label class="field">${L('Phone number', 'رقم الهاتف')}<input name="phone" type="tel" required dir="ltr"></label>
          <label class="field full">${L('Email (optional)', 'البريد (اختياري)')}<input name="email" type="email" dir="ltr"></label>
          <div class="full"><button class="btn small" type="submit">${L('Add patient', 'إضافة المريض')}</button></div>
        </form></details></div>
      <div class="book-grid" style="margin-top:0"><div class="cal" id="adCal"></div><div class="stack"><div id="adSlots"></div>
        <label class="check"><input type="checkbox" id="adOutside"><span>${L('Use a time outside normal hours', 'استخدام وقت خارج مواعيد العمل')}</span></label>
        <div id="adManual" class="form-grid hide"><label class="field">${L('Date', 'التاريخ')}<input type="date" id="adDate"></label><label class="field">${L('Time', 'الوقت')}<input type="time" id="adTime"></label></div>
        <label class="field">${L('Private note (optional)', 'ملاحظة خاصة (اختياري)')}<textarea id="adNote" maxlength="4000" rows="2"></textarea></label>
      </div></div></div>`,
    foot: html`<button class="btn line" type="button" data-close>${L('Go back', 'رجوع')}</button><button class="btn" id="adSave" type="button">${L('Save appointment', 'حفظ الموعد')}</button>`,
    onClose: () => { S.liveDialog = null; },
  });
  d.dataset.keep = '1';
  const st = { patient: null, slot: null };
  const choose = (p) => {
    st.patient = p;
    const c = $('#adChosen', d);
    c.textContent = `${L('Patient:', 'المريض:')} ${p.full_name}${p.phone ? ` (${p.phone})` : ''}`;
    c.classList.remove('hide');
    $('#adList', d).classList.add('hide');
    $('#adQ', d).value = '';
  };
  S.adChoose = (p) => { choose(p); $('#adNewWrap', d).open = false; };
  let t;
  $('#adQ', d).addEventListener('input', (e) => {
    clearTimeout(t);
    const q = e.target.value.trim();
    t = setTimeout(async () => {
      const box = $('#adList', d);
      if (q.length < 2) { box.classList.add('hide'); return; }
      const { patients } = await get(`/doctor/patients?q=${encodeURIComponent(q)}`);
      mount(box, patients.length ? html`${patients.slice(0, 12).map((p) => html`<button type="button" class="rx-result" data-p="${p.id}"><span><strong>${p.full_name}</strong> <span class="small muted ltr">${p.phone || ''}</span></span><span class="small muted">${p.email || ''}</span></button>`)}` : html`<div style="padding:10px" class="muted small">${L('No patient found.', 'لم يتم العثور على مريض.')}</div>`);
      box.classList.remove('hide');
      box.onclick = (ev) => { const b = ev.target.closest('[data-p]'); if (b) choose(patients.find((x) => x.id === b.dataset.p)); };
    }, 220);
  });
  const tp = timePicker($('#adCal', d), { slotsTarget: $('#adSlots', d), onPick: (s) => { st.slot = s; } });
  S.liveDialog = tp.reload;
  $('#adOutside', d).addEventListener('change', (e) => $('#adManual', d).classList.toggle('hide', !e.target.checked));
  $('#adSave', d).addEventListener('click', async () => {
    try {
      if (!st.patient) { bad(L('Choose a patient first.', 'اختر مريضًا أولاً.')); return; }
      const outside = $('#adOutside', d).checked;
      let start;
      if (outside) {
        const dv = $('#adDate', d).value, tv = $('#adTime', d).value;
        if (!dv || !tv) { bad(L('Enter a date and time.', 'أدخل التاريخ والوقت.')); return; }
        start = `${dv}T${tv}`;
      } else {
        if (!st.slot) { bad(L('Choose a day and a time.', 'اختر يومًا وموعدًا.')); return; }
        start = st.slot.start_at;
      }
      await post('/doctor/appointments', { patient_id: st.patient.id, start_at: start, outside_hours: outside, private_notes: $('#adNote', d).value });
      ok(L('Appointment added.', 'تمت إضافة الموعد.'));
      d.close();
      drawAppts().catch(() => {});
    } catch (e) { bad(e); tp.reload(); }
  });
};
F.adNew = async (fd, form) => {

};

const KIND = { blocked: ['Blocked date', 'تاريخ محظور'], holiday: ['Holiday', 'إجازة'], closure: ['Clinic closure', 'إغلاق العيادة'] };
async function drawCalMonth() {
  const el = $('#cmCal');

async function drawCalDay() {
  const box = $('#cmDay');

const redrawCal = async () => { await Promise.all([drawCalMonth(), drawCalDay(), drawSchedule()]); };
on(/^\/doctor\/calendar$/, async () => {
  CM.month = CM.month || monthOf(todayStr());
  const body = doctorShell('calendar', L('Calendar', 'التقويم'), html`<div class="cal-layout">
    <div class="stack-l" style="gap:14px;position:sticky;top:80px"><div class="cal" id="cmCal">${skeleton(4)}</div><div class="panel" id="cmDay"></div></div>
    <div class="stack-l" id="cmForms" style="gap:14px">${skeleton(4)}</div></div>`);
  $('#cmCal', body).addEventListener('click', (e) => {
    const nav = e.target.closest('[data-cal]');

    const b = e.target.closest('[data-day]');
    if (b) { CM.sel = b.dataset.day; drawCalMonth().catch(bad); drawCalDay().catch(bad); }

on(/^\/doctor\/patients$/, async () => {

on(/^\/doctor\/prescriptions\/(new|[\w-]+)$/, async ({ params: [id], query }) => {

  const { reviews, summary: s } = await get(`/doctor/reviews?${qs}`);
  mount($('#dBody'), html`<div class="split rv-split">
    <div class="panel"><div class="rev-score">${s.average === null ? '-' : num(s.average)}</div>${s.average ? stars(Math.round(s.average)) : ''}<p class="small muted" style="margin-top:4px">${L(`${s.count} published reviews`, `${num(s.count)} تقييم منشور`)}</p>
      <div class="dist">${s.distribution.map((d) => html`<span>${num(d.star)}</span><span class="bar"><i style="width:${s.count ? Math.round(d.count / s.count * 100) : 0}%"></i></span><span>${num(d.count)}</span>`)}</div></div>
    <div><div class="toolbar" style="margin-top:0"><select id="rvRating" style="width:auto" aria-label="${L('Filter by rating', 'تصفية حسب التقييم')}"><option value="">${L('All ratings', 'كل التقييمات')}</option>${[5, 4, 3, 2, 1].map((n) => html`<option value="${n}" ${String(RV.rating) === String(n) ? new Safe('selected') : ''}>${L(`${n} stars`, `${num(n)} نجوم`)}</option>`)}</select>
      <select id="rvStatus" style="width:auto" aria-label="${L('Status', 'الحالة')}"><option value="">${L('Published and hidden', 'المنشورة والمخفية')}</option>${['published', 'hidden'].map((k) => html`<option value="${k}" ${RV.status === k ? new Safe('selected') : ''}>${L(STATUS[k][0], STATUS[k][1])}</option>`)}</select></div>
    ${reviews.length ? html`<div class="stack">${reviews.map((r) => html`<article class="panel"><div class="row between">${stars(r.rating)}<div class="row" style="gap:8px">${badge(r.status)}<button class="btn small ${r.status === 'published' ? 'danger' : 'soft'}" data-act="modReview" data-id="${r.id}" data-to="${r.status === 'published' ? 'hidden' : 'published'}">${r.status === 'published' ? L('Hide review', 'إخفاء التقييم') : L('Publish review', 'نشر التقييم')}</button></div></div>
      ${r.comment ? html`<p style="margin-block:8px;overflow-wrap:anywhere" dir="auto">${r.comment}</p>` : ''}<div class="tiny muted"><a href="#/doctor/patients/${r.patient_id}">${r.patient_name}</a>, ${fDT(r.created_at)}${r.moderation_reason ? `, ${L('reason hidden:', 'سبب الإخفاء:')} ${r.moderation_reason}` : ''}</div></article>`)}</div>`
    : emptyState(L('No reviews found', 'لا توجد تقييمات'), L('Patients can review after a completed appointment.', 'يمكن للمرضى التقييم بعد اكتمال الموعد.'))}</div></div>`);
  $('#rvRating').addEventListener('change', (e) => { RV.rating = e.target.value; drawReviews().catch(bad); });
  $('#rvStatus').addEventListener('change', (e) => { RV.status = e.target.value; drawReviews().catch(bad); });
}

on(/^\/doctor\/settings(?:\/(\w+))?$/, async ({ params: [tabParam], query }) => {
  const tab = tabParam || 'clinic';
  const shell = doctorShell('settings', L('Clinic Settings', 'إعدادات العيادة'), html`<div class="tabs" role="tablist">${TABS().map(([k, l]) => html`<a class="tab ${tab === k ? 'on' : ''}" href="#/doctor/settings/${k}">${l}</a>`)}</div><div id="setBody">${skeleton(4)}</div>`);
  const body = $('#setBody', shell);
  try {
    if (tab === 'audit') { await drawAudit(body); return; }
    if (tab === 'email') { await drawEmailSettings(body, query); return; }
    const { settings: s, doctor: d, services } = await get('/doctor/settings');
    S.services = services;
    if (tab === 'clinic') {
      const social = s.social || {};
      mount(body, html`<div class="stack-l" style="gap:14px;max-width:820px">
        <div class="panel stack">${imgRow('logo', s.has_logo, `/api/public/logo?v=${Date.now()}`, L('Logo', 'الشعار'), L('Shown on the website and prescriptions. PNG or JPEG, up to 3 MB.', 'يظهر على الموقع والروشتات. PNG أو JPEG، حتى 3 ميجابايت.'))}
          ${imgRow('hero', s.has_hero, `/api/public/hero?v=${Date.now()}`, L('Clinic photo', 'صورة العيادة'), L('A real photo of your clinic for the homepage.', 'صورة حقيقية لعيادتك تظهر في الصفحة الرئيسية.'))}</div>

          <label class="field">${L('Clinic name (Arabic)', 'اسم العيادة (عربي)')}<input name="name_ar" type="text" required value="${s.name_ar}" dir="rtl"></label>

          <label class="field">${L('Address (Arabic)', 'العنوان (عربي)')}<input name="address_ar" type="text" value="${s.address_ar}" dir="rtl"></label>

    } else if (tab === 'services') {
      mount(body, html`<div class="stack" style="max-width:820px"><div><button class="btn" data-act="editSvc">${I.plus()}${L('Add service', 'إضافة خدمة')}</button></div>

    } else if (tab === 'doctor') {
      mount(body, html`<div class="stack-l" style="gap:14px;max-width:820px">
        <form class="panel form-grid" data-form="docProfile">${formError()}
          <label class="field">${L('Title', 'اللقب')}<input name="title" type="text" maxlength="40" value="${d.title || ''}" placeholder="${L('Dr.', 'د.')}"></label>

          <label class="field">${L('New password', 'كلمة المرور الجديدة')}<input name="new_password" type="password" required minlength="10" autocomplete="new-password"><span class="hint">${pwHelp(true)}</span></label>
          <div><button class="btn line" type="submit">${L('Change password', 'تغيير كلمة المرور')}</button></div></form></div>`);
    } else if (tab === 'prefs') {
      mount(body, html`<form class="panel stack" style="max-width:720px" data-form="prefs">${formError()}
        <h2>${L('Notify me in the portal about', 'أبلغني في البوابة عن')}</h2>
        ${Object.entries(NOTE_TYPES).map(([k, v]) => html`<label class="check"><input type="checkbox" name="n_${k}" ${s.doctor_notify?.[k] !== false ? new Safe('checked') : ''}><span>${L(v[0], v[1])}</span></label>`)}
        <h2 style="margin-top:10px">${L('Email patients about', 'راسل المرضى بخصوص')}</h2>
        ${['booking_received', 'appointment_confirmed', 'appointment_cancelled', 'appointment_rescheduled', 'appointment_reminder'].map((k) => html`<label class="check"><input type="checkbox" name="e_${k}" ${s.patient_emails?.[k] !== false ? new Safe('checked') : ''}><span>${L(EMAIL_TYPES[k][0], EMAIL_TYPES[k][1])}</span></label>`)}
        <div><button class="btn" type="submit">${L('Save preferences', 'حفظ التفضيلات')}</button></div></form>`);
    }
  } catch (e) { mount(body, errorBox(e)); }

document.addEventListener('change', async (e) => {
  const inp = e.target.closest('[data-upload]');
  if (!inp || !inp.files[0]) return;
  const file = inp.files[0];
  if (file.size > 3 * 1024 * 1024) { bad({ code: 'too_large' }); return; }
  try {
    await api('PUT', `/doctor/settings/${inp.dataset.upload}`, undefined, { raw: file, headers: { 'Content-Type': file.type === 'image/png' ? 'image/png' : 'image/jpeg' } });
    ok(L('Image saved.', 'تم حفظ الصورة.'));
    await loadClinic();
    refresh();
  } catch (err) { bad(err); }
});
A.rmImage = async (el) => {
  const yes = await confirmBox({ title: L('Remove this image?', 'حذف هذه الصورة؟'), text: L('You can upload another one at any time.', 'يمكنك رفع صورة أخرى في أي وقت.'), yes: L('Remove image', 'حذف الصورة'), danger: true });
  if (!yes) return;
  await api('DELETE', `/doctor/settings/${el.dataset.kind}`);
  await loadClinic();
  refresh();
};
F.settings = async (d) => {
  const social = { facebook: d.s_facebook, instagram: d.s_instagram, tiktok: d.s_tiktok, whatsapp: d.s_whatsapp };
  const body = { ...d, social };
  ['s_facebook', 's_instagram', 's_tiktok', 's_whatsapp'].forEach((k) => delete body[k]);
  await api('PATCH', '/doctor/settings', body);
  await loadClinic();
  ok(L('Changes saved.', 'تم حفظ التغييرات.'));
};
F.settingsNum = async (d) => {
  const body = { ...d };
  ['cancel_notice_hours', 'reminder_hours', 'max_active_bookings', 'booking_window_days'].forEach((k) => { body[k] = Number(d[k]); });
  await api('PATCH', '/doctor/settings', body);
  await loadClinic();
  ok(L('Changes saved.', 'تم حفظ التغييرات.'));
};
F.docProfile = async (d) => { await api('PATCH', '/doctor/profile', d); S.user.full_name = d.full_name; ok(L('Changes saved.', 'تم حفظ التغييرات.')); };
F.prefs = async (d) => {
  const doctor_notify = {}, patient_emails = {};
  Object.keys(d).forEach((k) => { if (k.startsWith('n_')) doctor_notify[k.slice(2)] = d[k]; if (k.startsWith('e_')) patient_emails[k.slice(2)] = d[k]; });
  await api('PATCH', '/doctor/settings', { doctor_notify, patient_emails });
  ok(L('Preferences saved.', 'تم حفظ التفضيلات.'));
};

      <label class="field">${L('Description (English)', 'الوصف (إنجليزي)')}<textarea name="desc_en" maxlength="400" dir="ltr">${v?.desc_en || ''}</textarea></label>

F.saveSvc = async (d, form) => {
  const body = { ...d, sort: Number(d.sort) };
  if (form.dataset.id) await api('PUT', `/doctor/services/${form.dataset.id}`, body); else await post('/doctor/services', body);
  form.closest('dialog').close();
  await loadClinic();
  refresh();
};
A.delSvc = async (el) => {
  const yes = await confirmBox({ title: L('Delete this service?', 'حذف هذه الخدمة؟'), text: L('It will disappear from the website. Past appointments stay in the records.', 'ستختفي من الموقع، وتبقى المواعيد السابقة في السجلات.'), yes: L('Delete service', 'حذف الخدمة'), danger: true });
  if (!yes) return;
  await api('DELETE', `/doctor/services/${el.dataset.id}`);
  await loadClinic();
  refresh();
};

async function drawEmailSettings(body, query) {
  const [g, { settings: s }] = await Promise.all([get('/doctor/gmail'), get('/doctor/settings')]);
  const result = { connected: ['ok', L('Gmail is connected.', 'تم ربط Gmail.')], denied: ['bad', L('Google access was not granted, so Gmail is not connected.', 'لم يتم منح إذن Google، لذا لم يتم الربط.')], failed: ['bad', L('Gmail could not be connected. Try again.', 'تعذر ربط Gmail. حاول مرة أخرى.')], forbidden: ['bad', L('Sign in as a doctor to connect Gmail.', 'سجل الدخول كطبيب لربط Gmail.')] }[query.gmail];
  mount(body, html`<div class="stack-l" style="gap:14px;max-width:820px">
    ${result ? html`<div class="notice ${result[0] === 'ok' ? 'info' : 'bad'}">${I.info()}<div>${result[1]}</div></div>` : ''}
    <div class="panel stack"><h2>${L('Gmail connection', 'ربط Gmail')}</h2>
      ${g.connected ? html`<div class="notice info">${I.check()}<div><strong>${L('Connected:', 'متصل:')}</strong> ${g.connection.google_email}<div class="small">${L('Connected on', 'تم الربط في')} ${fDT(g.connection.connected_at)}</div></div></div>
          ${g.connection.last_error ? html`<div class="notice bad">${I.warn()}<div>${L('Last problem from Google:', 'آخر مشكلة من Google:')} ${g.connection.last_error}</div></div>` : ''}
          <div class="row"><button class="btn" data-act="gmailTest">${L('Send me a test email', 'أرسل لي رسالة تجريبية')}</button><button class="btn danger" data-act="gmailOff">${L('Disconnect Gmail', 'فصل Gmail')}</button></div>`
    : g.configured ? html`<div class="notice">${I.warn()}<div>${L('Gmail is not connected, so no emails are being sent. Failed emails are kept in the log so you can retry them.', 'لم يتم ربط Gmail، لذا لا يتم إرسال أي رسائل. تبقى الرسائل الفاشلة في السجل لإعادة المحاولة.')}</div></div>
          <div><button class="btn" data-act="gmailOn">${L('Connect Gmail', 'ربط Gmail')}</button></div><p class="hint">${L('You sign in on Google\'s own page. This system never sees your Gmail password and asks only for permission to send.', 'تسجل الدخول في صفحة Google نفسها. لا يطلع النظام على كلمة مرور Gmail ويطلب إذن الإرسال فقط.')}</p>`
      : html`<div class="notice bad">${I.warn()}<div><strong>${L('Email is off.', 'البريد متوقف.')}</strong> ${L('The server has no Google credentials yet. Add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET to the settings file as the setup guide explains, then restart.', 'لا توجد بيانات اعتماد Google على الخادم بعد. أضف GOOGLE_CLIENT_ID وGOOGLE_CLIENT_SECRET كما يوضح دليل الإعداد، ثم أعد التشغيل.')}<div class="tiny" style="margin-top:6px" dir="ltr">Redirect URI: ${g.redirect_uri}</div></div></div>`}
    </div>
    <form class="panel stack" data-form="settings"><h2>${L('Sender name', 'اسم المرسل')}</h2>${formError()}<label class="field">${L('Name patients see on emails', 'الاسم الذي يراه المرضى في الرسائل')}<input name="email_sender_name" type="text" required minlength="2" maxlength="80" value="${s.email_sender_name}"></label><div><button class="btn line" type="submit">${L('Save', 'حفظ')}</button></div></form>
    <p class="small"><a href="#/doctor/notifications/emails">${L('See the email log', 'عرض سجل البريد')}</a></p></div>`);
}

};
A.gmailTest = async () => { await post('/doctor/gmail/test'); ok(L('Test email sent. Check your inbox.', 'تم إرسال رسالة تجريبية. تفقد بريدك.')); };

const AUDIT = { patient_record_viewed: ['Opened patient record', 'فتح ملف مريض'], patient_updated: ['Updated patient information', 'تعديل بيانات مريض'], patient_added: ['Added patient', 'إضافة مريض'], medical_record_added: ['Added medical note', 'إضافة ملاحظة طبية'], medical_record_updated: ['Changed medical note', 'تعديل ملاحظة طبية'], prescription_draft_created: ['Created prescription draft', 'إنشاء مسودة روشتة'], prescription_draft_updated: ['Changed prescription draft', 'تعديل مسودة روشتة'], prescription_draft_deleted: ['Deleted prescription draft', 'حذف مسودة روشتة'], prescription_approved: ['Approved prescription', 'اعتماد روشتة'], prescription_voided: ['Voided prescription', 'إلغاء روشتة'], prescription_copied: ['Copied prescription', 'نسخ روشتة'], prescription_email_attempt: ['Tried to email prescription', 'محاولة إرسال روشتة بالبريد'], appointment_confirmed: ['Confirmed appointment', 'تأكيد موعد'], appointment_rejected: ['Rejected appointment', 'رفض موعد'], appointment_cancelled: ['Cancelled appointment', 'إلغاء موعد'], appointment_completed: ['Completed appointment', 'إكمال موعد'], appointment_rescheduled: ['Rescheduled appointment', 'تغيير موعد'], appointment_added: ['Added appointment', 'إضافة موعد'], appointment_notes_updated: ['Changed appointment notes', 'تعديل ملاحظات موعد'], doctor_signed_in: ['Doctor signed in', 'دخول طبيب'], doctor_registered: ['Doctor registered', 'تسجيل طبيب'], gmail_connected: ['Connected Gmail', 'ربط Gmail'], gmail_disconnected: ['Disconnected Gmail', 'فصل Gmail'], settings_updated: ['Changed clinic settings', 'تعديل إعدادات العيادة'], working_hours_updated: ['Changed working hours', 'تعديل مواعيد العمل'], date_blocked: ['Blocked a date', 'حظر تاريخ'], date_unblocked: ['Unblocked a date', 'إلغاء حظر تاريخ'], clinic_closure_changed: ['Changed clinic closure', 'تعديل إغلاق العيادة'], review_moderated: ['Moderated review', 'مراجعة تقييم'], medicine_added: ['Added medicine', 'إضافة دواء'], medicine_updated: ['Changed medicine', 'تعديل دواء'], medicine_verified: ['Verified medicine', 'مراجعة دواء'], email_retried: ['Retried email', 'إعادة إرسال بريد'], email_consent_changed: ['Patient changed email consent', 'غيّر المريض موافقة البريد'] };
async function drawAudit(body) {
  const { audit } = await get('/doctor/audit');
  mount(body, html`<p class="muted small" style="margin-bottom:12px">${L('Important actions on medical records and prescriptions. Entries cannot be changed or deleted.', 'الإجراءات المهمة على السجلات الطبية والروشتات. لا يمكن تعديل هذه السجلات أو حذفها.')}</p>
    ${audit.length ? html`<div class="table-wrap"><table class="tbl"><thead><tr><th>${L('When', 'الوقت')}</th><th>${L('Who', 'من')}</th><th>${L('Action', 'الإجراء')}</th><th>${L('Patient', 'المريض')}</th></tr></thead><tbody>${audit.map((a) => html`<tr><td class="small" style="white-space:nowrap">${fDT(a.created_at)}</td><td class="small">${a.actor_name || L('System', 'النظام')}</td><td>${AUDIT[a.action] ? L(AUDIT[a.action][0], AUDIT[a.action][1]) : a.action.replace(/_/g, ' ')}</td><td class="small">${a.patient_name || '-'}</td></tr>`)}</tbody></table></div>` : emptyState(L('No activity yet', 'لا يوجد نشاط بعد'), '')}`);
}

/* ---------- Doctor notifications and email log ---------- */
on(/^\/doctor\/notifications(?:\/(emails))?$/, async ({ params: [sub] }) => {
  const body = doctorShell('notifications', L('Notifications', 'الإشعارات'), html`<div class="tabs"><a class="tab ${sub ? '' : 'on'}" href="#/doctor/notifications">${L('Notifications', 'الإشعارات')}</a><a class="tab ${sub ? 'on' : ''}" href="#/doctor/notifications/emails">${L('Email log', 'سجل البريد')}</a></div><div id="nBody">${skeleton()}</div>`);
  const box = $('#nBody', body);
  const draw = async () => {
    if (sub) {
      const { emails } = await get('/doctor/emails');
      mount(box, emails.length ? html`<div class="table-wrap"><table class="tbl"><thead><tr><th>${L('Sent to', 'المرسل إليه')}</th><th>${L('Type', 'النوع')}</th><th>${L('When', 'الوقت')}</th><th>${L('Result', 'النتيجة')}</th><th><span class="sr">${L('Actions', 'الإجراءات')}</span></th></tr></thead><tbody>${emails.map((e) => html`<tr><td><strong>${e.patient_name || ''}</strong><div class="tiny muted">${e.recipient || L('No email address', 'لا يوجد بريد')}</div></td><td class="small">${EMAIL_TYPES[e.type] ? L(EMAIL_TYPES[e.type][0], EMAIL_TYPES[e.type][1]) : e.type}</td><td class="small" style="white-space:nowrap">${fDT(e.created_at)}</td><td>${badge(e.status)}${e.status === 'failed' ? html`<div class="tiny" style="color:#9C1F1F;max-width:280px;margin-top:3px">${ERR[e.error_code] ? L(ERR[e.error_code][0], ERR[e.error_code][1]) : e.error_detail}</div>` : ''}</td><td style="text-align:end">${e.status === 'failed' && e.retryable ? html`<button class="btn small" data-act="emailRetry" data-id="${e.id}">${L('Retry', 'إعادة المحاولة')}</button>` : ''}</td></tr>`)}</tbody></table></div>` : emptyState(L('No emails yet', 'لا توجد رسائل بعد'), L('Every email the system tries to send is recorded here.', 'تُسجل هنا كل رسالة يحاول النظام إرسالها.')));
    } else {
      const { notifications: list } = await get('/notifications');
      mount(box, html`${list.some((n) => !n.read_at) ? html`<div style="margin-bottom:10px"><button class="btn soft small" data-act="readAll">${L('Mark all as read', 'تحديد الكل كمقروء')}</button></div>` : ''}<div class="panel">${list.length ? list.map(noteRow) : emptyState(L('No notifications', 'لا توجد إشعارات'), L('New bookings, cancellations, patients and reviews appear here.', 'تظهر هنا الحجوزات والإلغاءات والمرضى والتقييمات الجديدة.'))}</div>`);
    }
  };
  try { await draw(); } catch (e) { mount(box, errorBox(e)); }
  S.live = () => draw().catch(() => {});
}, 'doctor');

/* ========== Start ========== */
(async function boot() {
  setLangAttrs();
  if (location.protocol === 'file:') {
    mount($('#app'), html`<main class="auth-page" style="min-height:100dvh"><div class="auth-card"><h1>${L('Start the server to use LOLY', 'شغّل الخادم لاستخدام لولي')}</h1>
      <p class="muted" style="margin-top:8px">${L('This page needs its server and database for sign-in, booking and medical records. Run "npm start" in the project folder, then open the address it shows. The README has the full steps.', 'تحتاج هذه الصفحة إلى الخادم وقاعدة البيانات لتسجيل الدخول والحجز والسجلات الطبية. نفذ "npm start" في مجلد المشروع ثم افتح العنوان الذي يظهر. الخطوات كاملة في ملف README.')}</p></div></main>`);
    return;
  }
  try {
    const [{ user }] = await Promise.all([get('/auth/me'), loadClinic()]);
    S.user = user;
    if (user) { startLive(); }
    await route();
  } catch (e) {
    mount($('#app'), html`<main class="auth-page" style="min-height:100dvh"><div class="auth-card"><h1>${L('The clinic system is not available right now', 'نظام العيادة غير متاح حاليًا')}</h1><p class="muted" style="margin-block:8px 16px">${errText(e)}</p><button class="btn" id="bootRetry">${L('Try again', 'حاول مرة أخرى')}</button></div></main>`);
    $('#bootRetry').addEventListener('click', () => location.reload());
  }
}());
</script>
